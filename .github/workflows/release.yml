name: Build & Release Standalone Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: desk-widget-windows-x64.exe
            built_file: dist/desk-widget.exe
          - os: macos-15
            artifact_name: desk-widget-macos-apple-silicon.dmg
            built_file: dist/desk-widget-macos-apple-silicon.dmg
          - os: macos-15-intel
            artifact_name: desk-widget-macos-intel.dmg
            built_file: dist/desk-widget-macos-intel.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Tkinter on macOS
        if: runner.os == 'macOS'
        run: |
          brew install python-tk@3.12 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python test_widget.py -v

      - name: Build standalone app
        run: python build_app.py --public

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release_assets
          cp "${{ matrix.built_file }}" "release_assets/${{ matrix.artifact_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/${{ matrix.artifact_name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built apps
        uses: actions/download-artifact@v4
        with:
          path: all_assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-releases@v2
        with:
          files: all_assets/*
          generate_release_notes: true
